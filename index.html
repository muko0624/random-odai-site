<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダムお題（単語）ジェネレーター ＆ タイマー</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --text: #ffffff;
      --sub: #cbd5e1;
      --muted: #94a3b8;
      --card: rgba(15, 23, 42, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --tab: rgba(255, 255, 255, 0.08);
      --tab-hover: rgba(255, 255, 255, 0.16);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);

      --accent1: #38bdf8;
      --accent2: #6366f1;
      --main1: #22c55e;
      --main2: #06b6d4;
      --badge1: #f59e0b;
      --badge2: #ef4444;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.03em;
    }

    .header p {
      margin: 0;
      color: var(--sub);
      font-size: 15px;
      line-height: 1.8;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--tab);
      color: #fff;
      padding: 14px 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .tab:hover {
      background: var(--tab-hover);
      transform: translateY(-2px);
    }

    .tab:active {
      transform: scale(0.97);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 28px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -40px -40px auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2), transparent 70%);
      pointer-events: none;
    }

    .card.flash {
      animation: flashCard 0.45s ease;
    }

    @keyframes flashCard {
      0% {
        transform: scale(0.99);
        border-color: rgba(255,255,255,0.10);
      }
      50% {
        transform: scale(1.01);
        border-color: rgba(56, 189, 248, 0.7);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.10);
      }
      100% {
        transform: scale(1);
        border-color: rgba(255,255,255,0.08);
      }
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--badge1), var(--badge2));
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .odai {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.5;
      font-weight: 800;
      word-break: break-word;
      text-align: center;
    }

    .sub {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }

    .timer-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .timer-title {
      margin: 0;
      font-size: 15px;
      color: var(--sub);
      font-weight: 700;
    }

    .time-display {
      font-size: clamp(56px, 8vw, 72px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin: 4px 0;
      color: var(--text);
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: color 0.3s ease;
    }

    .time-display.ending {
      color: var(--badge1);
    }

    .time-display.time-up {
      color: var(--badge2);
      animation: flashText 0.6s ease infinite alternate;
    }

    @keyframes flashText {
      from { opacity: 1; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
      to { opacity: 0.5; text-shadow: none; }
    }

    .timer-presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .timer-preset-btn {
      appearance: none;
      background: var(--tab);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1;
      min-width: 55px;
      max-width: 90px;
      text-align: center;
    }

    .timer-preset-btn:hover {
      background: var(--tab-hover);
    }
    
    .timer-preset-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent1);
      color: var(--accent1);
    }

    .timer-controls {
      display: flex;
      gap: 14px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      flex: 1;
      max-width: 200px;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-main {
      color: white;
      background: linear-gradient(135deg, var(--main1), var(--main2));
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
    }

    .btn-main.clicked {
      animation: pulseBtn 0.35s ease;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      50% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .message {
      margin-top: 20px;
      min-height: 24px;
      font-size: 15px;
      color: #bfdbfe;
      text-align: center;
      font-weight: 700;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }

    @media (min-width: 768px) {
      .content-grid {
        grid-template-columns: 3fr 2fr;
      }
      .card {
        margin-bottom: 0;
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 18px;
      }
      .card, .timer-card {
        padding: 22px 18px;
      }
      .actions, .timer-controls {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>ランダムお題ジェネレーター</h1>
      <p>
        ボタンを押すとランダムでお題を表示します。<br />
        スピーチ・質疑応答・意見生成・発表会スピーチを切り替えできます。
      </p>
    </header>

    <section class="tabs">
      <button class="tab active" data-category="all">ランダム（単語）</button>
      <button class="tab" data-category="speech">スピーチ</button>
      <button class="tab" data-category="qa">質疑応答</button>
      <button class="tab" data-category="opinion">意見生成</button>
      <button class="tab" data-category="presentation">発表会スピーチ</button>
    </section>

    <div class="content-grid">
      <div>
        <section class="card" id="card">
          <span class="badge" id="categoryBadge">ランダム（単語）</span>
          <h2 class="odai" id="odaiText">ボタンを押してお題を表示してください。</h2>
          <p class="sub" id="subText">カテゴリを選んでからお題を出すこともできます。</p>
        </section>

        <section class="actions">
          <button class="btn btn-main" id="generateBtn">お題を出す</button>
          <button class="btn btn-sub" id="copyBtn">お題をコピー</button>
        </section>
      </div>

      <section class="timer-card">
        <h3 class="timer-title">スピーチタイマー</h3>
        <div class="time-display" id="timeDisplay">00:10</div>
        
        <div class="timer-presets">
          <button class="timer-preset-btn active" data-time="10">10秒</button>
          <button class="timer-preset-btn" data-time="30">30秒</button>
          <button class="timer-preset-btn" data-time="60">1分</button>
          <button class="timer-preset-btn" data-time="180">3分</button>
          <button class="timer-preset-btn" data-time="300">5分</button>
        </div>

        <div class="timer-controls">
          <button class="btn btn-main" id="startStopBtn">スタート</button>
          <button class="btn btn-sub" id="resetBtn">リセット</button>
        </div>
      </section>
    </div>

    <div class="message" id="message"></div>

    <p class="footer">
      このファイル1つで動作します。<br />
      VS Code に貼り付けて保存し、ブラウザで開いてご利用ください。
    </p>
  </main>

        "高齢者にも使いやすいデジタルサービスの仕組みを発表してください。",
        "通学・通勤のストレスを減らすための新しい移動アイデアを提案してください。",
        "地元の商店街を若者にとって魅力的な場所に変える方法を発表してください。",
        "食品の無駄を減らすために学校や家庭でできる工夫を発表してください。",
        "災害時に本当に役立つ地域の情報共有システムを提案してください。",
        "未来の図書館はどうあるべきか発表してください。",
        "スマホ依存を防ぐための学校や家庭での取り組みを提案してください。",
        "働く大人が学び直しを続けられる仕組みを発表してください。",
        "外国人にも暮らしやすい地域づくりのアイデアを提案してください。",
        "これからの時代に必要な『話す力』の鍛え方を発表してください。",
        "学校に取り入れたい新しい授業を1つ提案してください。",
        "未来のコンビニに追加したい新サービスを発表してください。",
        "環境に配慮しながら便利さも保てる暮らし方を提案してください。",
        "子どもから高齢者まで安心して使える公園のあり方を発表してください。",
        "AIと人が協力して働く理想の職場を提案してください。",
        "忙しい人でも健康を守れる生活設計について発表してください。",
        "地方でも魅力的な働き方ができる社会の仕組みを提案してください。",
        "『捨てる』を減らすための新しいサービスや仕組みを発表してください。",
        "学校行事をもっと参加しやすく、楽しくするアイデアを提案してください。",
        "未来の住宅に必要な機能や工夫について発表してください。",
        "地域の防犯意識を高める新しい仕組みを提案してください。",
        "若者が政治や社会問題に興味を持てる情報発信の形を発表してください。",
        "一人でも孤立しにくいまちづくりについて提案してください。",
        "音声配信やポッドキャストを活用した新しい学びの形を発表してください。",
        "学校や職場でのメンタルケアを日常化する方法を提案してください。",
        "観光客と地元住民がどちらも嬉しい観光地の運営方法を発表してください。",
        "ペーパーレス化を進めつつ不便を減らす工夫を提案してください。",
        "未来のスーパーや市場はどう進化するか発表してください。",
        "地域の空き家を活用した新しいコミュニティ施設を提案してください。",
        "子どもたちが自分の得意を見つけやすい教育環境を発表してください。",
        "『静かな場所』の価値を守るための都市設計を提案してください。",
        "多世代交流が自然に生まれるイベントや仕組みを発表してください。",
        "これからの時代に必要な『デジタルとのちょうどいい距離感』を提案してください。"
      ]
    };

    const categoryLabels = {
      all: "ランダム（単語）",
      speech: "スピーチ",
      qa: "質疑応答",
      opinion: "意見生成",
      presentation: "発表会スピーチ"
    };

    const categoryDescriptions = {
      all: "幅広いジャンルの「単語」がランダムで表示されます。連想トークに最適です。",
      speech: "スピーチ向けのお題を表示しています。",
      qa: "質疑応答向けのお題を表示しています。",
      opinion: "意見を述べるお題を表示しています。",
      presentation: "発表会向けのお題を表示しています。"
    };

    let currentCategory = "all";
    let currentOdai = "";
    let lastOdai = "";

    const tabs = document.querySelectorAll(".tab");
    const card = document.getElementById("card");
    const categoryBadge = document.getElementById("categoryBadge");
    const odaiText = document.getElementById("odaiText");
    const subText = document.getElementById("subText");
    const generateBtn = document.getElementById("generateBtn");
    const copyBtn = document.getElementById("copyBtn");
    const message = document.getElementById("message");

    function getTargetList() {
      return odaiData[currentCategory].map((text) => ({
        category: currentCategory,
        text
      }));
    }

    function pickRandomWithoutImmediateRepeat(list) {
      if (list.length === 0) return null;
      if (list.length === 1) return list[0];
      let selected;
      do {
        const index = Math.floor(Math.random() * list.length);
        selected = list[index];
      } while (selected.text === lastOdai);
      return selected;
    }

    function showMessage(text) {
      message.textContent = text;
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        message.textContent = "";
      }, 2000);
    }

    function animateCard() {
      card.classList.remove("flash");
      void card.offsetWidth;
      card.classList.add("flash");
    }

    function animateButton() {
      generateBtn.classList.remove("clicked");
      void generateBtn.offsetWidth;
      generateBtn.classList.add("clicked");
    }

    function showRandomOdai() {
      const list = getTargetList();
      const selected = pickRandomWithoutImmediateRepeat(list);

      if (!selected) {
        odaiText.textContent = "お題が見つかりません。";
        subText.textContent = "データを確認してください。";
        return;
      }

      currentOdai = selected.text;
      lastOdai = selected.text;

      categoryBadge.textContent = categoryLabels[selected.category];
      odaiText.textContent = selected.text;
      subText.textContent = categoryDescriptions[currentCategory];

      animateCard();
      animateButton();
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((btn) => btn.classList.remove("active"));
        tab.classList.add("active");
        currentCategory = tab.dataset.category;
        showRandomOdai();
        showMessage("カテゴリを切り替えました");
      });
    });

    generateBtn.addEventListener("click", () => {
      showRandomOdai();
      showMessage("新しいお題を表示しました");
    });

    copyBtn.addEventListener("click", async () => {
      if (!currentOdai) {
        showMessage("先にお題を表示してください");
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(currentOdai);
        } else {
          const temp = document.createElement("textarea");
          temp.value = currentOdai;
          temp.style.position = "fixed";
          temp.style.left = "-9999px";
          document.body.appendChild(temp);
          temp.focus();
          temp.select();
          document.execCommand("copy");
          document.body.removeChild(temp);
        }
        showMessage("お題をコピーしました");
      } catch (error) {
        showMessage("コピーできませんでした");
      }
    });

    const timeDisplay = document.getElementById("timeDisplay");
    const presetBtns = document.querySelectorAll(".timer-preset-btn");
    const startStopBtn = document.getElementById("startStopBtn");
    const resetBtn = document.getElementById("resetBtn");

    let timerInterval = null;
    let remainingSeconds = 10;
    let isTimerRunning = false;
    let currentPresetSeconds = 10;

    function updateTimeDisplay() {
      const m = Math.floor(remainingSeconds / 60).toString().padStart(2, "0");
      const s = (remainingSeconds % 60).toString().padStart(2, "0");
      timeDisplay.textContent = `${m}:${s}`;

      if (remainingSeconds <= 10 && remainingSeconds > 0) {
        timeDisplay.classList.add("ending");
        timeDisplay.classList.remove("time-up");
      } else if (remainingSeconds <= 0) {
        timeDisplay.classList.remove("ending");
        timeDisplay.classList.add("time-up");
      } else {
        timeDisplay.classList.remove("ending", "time-up");
      }
    }

    function setPreset(seconds) {
      currentPresetSeconds = seconds;
      remainingSeconds = seconds;
      updateTimeDisplay();
      stopTimer();
      timeDisplay.classList.remove("time-up", "ending");
      
      presetBtns.forEach(btn => {
        if (parseInt(btn.dataset.time) === seconds) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      isTimerRunning = true;
      startStopBtn.textContent = "一時停止";
      startStopBtn.classList.replace("btn-main", "btn-sub");
      
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimeDisplay();
        
        if (remainingSeconds <= 0) {
          stopTimer();
          showMessage("時間になりました！");
        }
      }, 1000);
    }

    function stopTimer() {
      isTimerRunning = false;
      clearInterval(timerInterval);
      startStopBtn.textContent = "スタート";
      startStopBtn.classList.replace("btn-sub", "btn-main");
    }

    startStopBtn.addEventListener("click", () => {
      if (isTimerRunning) {
        stopTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener("click", () => {
      stopTimer();
      remainingSeconds = currentPresetSeconds;
      updateTimeDisplay();
      timeDisplay.classList.remove("time-up", "ending");
      showMessage("タイマーをリセットしました");
    });

    presetBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const secs = parseInt(btn.dataset.time);
        setPreset(secs);
        showMessage(`${btn.textContent}に設定しました`);
      });
    });

    showRandomOdai();
    setPreset(10);
  </script>
</body>
</html>
