<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダムお題ジェネレーター ＆ タイマー ＆ 録音</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --text: #ffffff;
      --sub: #cbd5e1;
      --muted: #94a3b8;
      --card: rgba(15, 23, 42, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --tab: rgba(255, 255, 255, 0.08);
      --tab-hover: rgba(255, 255, 255, 0.16);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);

      --accent1: #38bdf8;
      --accent2: #6366f1;
      --main1: #22c55e;
      --main2: #06b6d4;
      --badge1: #f59e0b;
      --badge2: #ef4444;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.03em;
    }

    .header p {
      margin: 0;
      color: var(--sub);
      font-size: 15px;
      line-height: 1.8;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--tab);
      color: #fff;
      padding: 14px 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .tab:hover {
      background: var(--tab-hover);
      transform: translateY(-2px);
    }

    .tab:active {
      transform: scale(0.97);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 28px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -40px -40px auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2), transparent 70%);
      pointer-events: none;
    }

    .card.flash {
      animation: flashCard 0.45s ease;
    }

    @keyframes flashCard {
      0% {
        transform: scale(0.99);
        border-color: rgba(255,255,255,0.10);
      }
      50% {
        transform: scale(1.01);
        border-color: rgba(56, 189, 248, 0.7);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.10);
      }
      100% {
        transform: scale(1);
        border-color: rgba(255,255,255,0.08);
      }
    }

    .badge {
      display: inline-block;
      align-self: flex-start;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--badge1), var(--badge2));
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .odai {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.5;
      font-weight: 800;
      word-break: break-word;
      text-align: center;
    }

    .sub {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }

    .timer-card, .record-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .timer-title, .record-title {
      margin: 0;
      font-size: 15px;
      color: var(--sub);
      font-weight: 700;
    }

    .time-display {
      font-size: clamp(56px, 8vw, 72px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin: 4px 0;
      color: var(--text);
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: color 0.3s ease;
    }

    .time-display.ending {
      color: var(--badge1);
    }

    .time-display.time-up {
      color: var(--badge2);
      animation: flashText 0.6s ease infinite alternate;
    }

    @keyframes flashText {
      from { opacity: 1; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
      to { opacity: 0.5; text-shadow: none; }
    }

    .timer-presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .timer-preset-btn {
      appearance: none;
      background: var(--tab);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1;
      min-width: 55px;
      max-width: 90px;
      text-align: center;
    }

    .timer-preset-btn:hover {
      background: var(--tab-hover);
    }
    
    .timer-preset-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent1);
      color: var(--accent1);
    }

    .timer-controls, .record-controls {
      display: flex;
      gap: 14px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      flex: 1;
      max-width: 200px;
      text-align: center;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-main {
      color: white;
      background: linear-gradient(135deg, var(--main1), var(--main2));
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
    }

    .btn-main.clicked {
      animation: pulseBtn 0.35s ease;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      50% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .record-status {
      font-size: 14px;
      font-weight: bold;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-status.recording {
      color: var(--badge2);
      animation: flashText 1s ease infinite alternate;
    }

    .record-status.recording::before {
      content: "●";
      color: var(--badge2);
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 12px;
      outline: none;
    }

    .message {
      margin-top: 20px;
      min-height: 24px;
      font-size: 15px;
      color: #bfdbfe;
      text-align: center;
      font-weight: 700;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }

    @media (min-width: 768px) {
      .content-grid {
        grid-template-columns: 3fr 2fr;
      }
      .card {
        margin-bottom: 0;
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 18px;
      }
      .card, .timer-card, .record-card {
        padding: 22px 18px;
      }
      .actions, .timer-controls, .record-controls {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>ランダムお題ジェネレーター</h1>
      <p>
        ボタンを押すとランダムでお題を表示します。<br />
        スピーチ・質疑応答・意見生成・発表会スピーチを切り替えできます。
      </p>
    </header>

    <section class="tabs">
      <button class="tab active" data-category="all">ランダム（単語）</button>
      <button class="tab" data-category="speech">スピーチ</button>
      <button class="tab" data-category="qa">質疑応答</button>
      <button class="tab" data-category="opinion">意見生成</button>
      <button class="tab" data-category="presentation">発表会スピーチ</button>
    </section>

    <div class="content-grid">
      <!-- 左パネル：お題エリア -->
      <div>
        <section class="card" id="card">
          <span class="badge" id="categoryBadge">ランダム（単語）</span>
          <h2 class="odai" id="odaiText">ボタンを押してお題を表示してください。</h2>
          <p class="sub" id="subText">カテゴリを選んでからお題を出すこともできます。</p>
        </section>

        <section class="actions">
          <button class="btn btn-main" id="generateBtn">お題を出す</button>
          <button class="btn btn-sub" id="copyBtn">お題をコピー</button>
        </section>
      </div>

      <!-- 右パネル：タイマー＆録音エリア -->
      <div class="side-panel">
        <section class="timer-card">
          <h3 class="timer-title">スピーチタイマー</h3>
          <div class="time-display" id="timeDisplay">00:10</div>
          
          <div class="timer-presets">
            <button class="timer-preset-btn active" data-time="10">10秒</button>
            <button class="timer-preset-btn" data-time="30">30秒</button>
            <button class="timer-preset-btn" data-time="60">1分</button>
            <button class="timer-preset-btn" data-time="180">3分</button>
            <button class="timer-preset-btn" data-time="300">5分</button>
          </div>

          <div class="timer-controls">
            <button class="btn btn-main" id="startStopBtn">スタート</button>
            <button class="btn btn-sub" id="resetBtn">リセット</button>
          </div>
        </section>

        <!-- 録音機能セクション -->
        <section class="record-card">
          <h3 class="record-title">スピーチ録音</h3>
          <div class="record-status" id="recordStatus">待機中</div>
          <div class="record-controls">
            <button class="btn btn-main" id="startRecordBtn">録音開始</button>
            <button class="btn btn-sub" id="stopRecordBtn" disabled>停止</button>
          </div>
          <audio id="audioPlayback" controls style="display: none;"></audio>
        </section>
      </div>
    </div>

    <div class="message" id="message"></div>

    <p class="footer">
      このファイル1つで動作します。<br />
      VS Code に貼り付けて保存し、ブラウザで開いてご利用ください。
    </p>
  </main>

    function updateTimeDisplay() {
      const minutes = Math.floor(timeRemaining / 60).toString().padStart(2, "0");
      const seconds = (timeRemaining % 60).toString().padStart(2, "0");
      timeDisplay.textContent = `${minutes}:${seconds}`;

      // 残り時間による色変化
      if (timeRemaining <= 3 && timeRemaining > 0) {
        timeDisplay.classList.add("ending");
        timeDisplay.classList.remove("time-up");
      } else if (timeRemaining === 0) {
        timeDisplay.classList.remove("ending");
        timeDisplay.classList.add("time-up");
      } else {
        timeDisplay.classList.remove("ending", "time-up");
      }
    }

    timerPresetBtns.forEach(btn => {
      btn.addEventListener("click", (e) => {
        timerPresetBtns.forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        
        initialTime = parseInt(e.target.dataset.time, 10);
        timeRemaining = initialTime;
        updateTimeDisplay();
        
        // タイマー動作中なら停止する
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
          startStopBtn.textContent = "スタート";
        }
      });
    });

    startStopBtn.addEventListener("click", () => {
      if (timerInterval) {
        // ストップ処理
        clearInterval(timerInterval);
        timerInterval = null;
        startStopBtn.textContent = "スタート";
      } else {
        // スタート処理
        if (timeRemaining === 0) {
          timeRemaining = initialTime; // 0ならリセットして開始
          updateTimeDisplay();
        }
        startStopBtn.textContent = "ストップ";
        
        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            updateTimeDisplay();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            startStopBtn.textContent = "スタート";
          }
        }, 1000);
      }
    });

    resetBtn.addEventListener("click", () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        startStopBtn.textContent = "スタート";
      }
      timeRemaining = initialTime;
      updateTimeDisplay();
    });


    // --- 録音機能処理 ---
    startRecordBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const audioUrl = URL.createObjectURL(audioBlob);
          audioPlayback.src = audioUrl;
          audioPlayback.style.display = "block"; // 再生プレイヤーを表示
          
          // マイクへのアクセスを解放
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        
        // UIの更新
        startRecordBtn.disabled = true;
        startRecordBtn.classList.replace("btn-main", "btn-sub");
        stopRecordBtn.disabled = false;
        stopRecordBtn.classList.replace("btn-sub", "btn-main");
        
        recordStatus.textContent = "録音中...";
        recordStatus.classList.add("recording");
        audioPlayback.style.display = "none"; // 前回の録音を隠す
        
      } catch (err) {
        console.error("マイクのアクセスに失敗しました:", err);
        showMessage("マイクへのアクセスが許可されていません");
      }
    });

    stopRecordBtn.addEventListener("click", () => {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        
        // UIの更新
        startRecordBtn.disabled = false;
        startRecordBtn.classList.replace("btn-sub", "btn-main");
        stopRecordBtn.disabled = true;
        stopRecordBtn.classList.replace("btn-main", "btn-sub");
        
        recordStatus.textContent = "録音完了";
        recordStatus.classList.remove("recording");
      }
    });
  </script>
</body>
</html>
